# Cycle+ par Happy Mum's — Configuration Netlify

[[headers]]
  for = "/*"
  [headers.values]
    # Empêche l'app d'être chargée dans une iframe (clickjacking)
    X-Frame-Options = "DENY"
    # Empêche le navigateur de deviner le type de fichier
    X-Content-Type-Options = "nosniff"
    # Contrôle les infos envoyées au site suivant
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Désactive caméra, micro, géolocalisation (pas besoin pour Cycle+)
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Force HTTPS pour 1 an
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Service worker doit être servi sans cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Manifest sans cache agressif
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Assets statiques avec cache long
[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
